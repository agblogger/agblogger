[project]
name = "agblogger-core"
version = "0.1.3"
description = "Shared post-filesystem path and slug utilities for AgBlogger (server + sync CLI)"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Lukasz Czajka" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agblogger_core"]
